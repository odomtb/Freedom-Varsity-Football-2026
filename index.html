    padding:16px 44px 16px 16px;
    border:2px solid var(--line);
    border-radius:14px;
    color:var(--navy);
    background:var(--gray);
    outline:none;
  }
  #numInput:focus{border-color:var(--red);}
  #clearBtn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    background:#d5d8e0;
    color:#fff;
    border:none;
    width:28px;height:28px;
    border-radius:50%;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:none;
  }
  .result{
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .result-card{
    width:100%;
    background:var(--gray);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 18px;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .result-card .jersey{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:66px;height:66px;
    border-radius:50%;
    background:var(--red);
    color:var(--white);
    font-size:26px;
    font-weight:800;
    margin-bottom:12px;
    border:3px solid var(--navy);
  }
  .result-card .name{
    font-size:22px;
    font-weight:800;
    color:var(--navy);
  }
  .result-card .meta{
    margin-top:6px;
    font-size:13.5px;
    font-weight:600;
    color:#8a90a3;
    letter-spacing:0.3px;
  }
  .placeholder{
    color:#a7abba;
    font-size:15px;
    padding:10px 20px;
  }
  .placeholder .big{
    font-size:38px;
    display:block;
    margin-bottom:8px;
  }
  .not-found{
    color:var(--red);
    font-weight:700;
    font-size:16px;
  }
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:18px;
  }
  .keypad button{
    padding:16px 0;
    font-size:20px;
    font-weight:700;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--navy);
    cursor:pointer;
  }
  .keypad button:active{background:var(--gray);}
  .keypad .zero{grid-column:2;}
  .keypad .back{
    background:var(--gray);
    color:var(--red);
  }

  /* Roster list view */
  .search-list{
    width:100%;
    padding:12px 14px;
    font-size:15px;
    border:2px solid var(--line);
    border-radius:12px;
    margin-bottom:14px;
    outline:none;
    background:var(--gray);
  }
  .search-list:focus{border-color:var(--red);}
  .roster-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
  }
  .roster-item .num{
    flex-shrink:0;
    width:40px;height:40px;
    border-radius:50%;
    background:var(--navy);
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:14px;
  }
  .roster-item .nm-wrap{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .roster-item .nm{
    font-size:15.5px;
    font-weight:600;
    color:var(--navy);
  }
  .roster-item .sub{
    font-size:12.5px;
    font-weight:600;
    color:#8a90a3;
  }
  .count{
    text-align:center;
    color:#8a90a3;
    font-size:12.5px;
    margin-bottom:10px;
  }
  .no-results{
    text-align:center;
    color:#a7abba;
    padding:30px 0;
  }

  /* Coaches view */
  .coach-section-label{
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#8a90a3;
    margin:20px 0 10px;
  }
  .coach-section-label:first-child{
    margin-top:0;
  }
  .coach-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 14px;
    background:var(--gray);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:10px;
  }
  .coach-item.head{
    background:linear-gradient(135deg,var(--navy) 0%,#1c3a78 100%);
    border-color:var(--navy);
  }
  .coach-item.head .coach-name{
    color:var(--white);
    font-size:18px;
  }
  .coach-icon{
    flex-shrink:0;
    width:40px;height:40px;
    border-radius:50%;
    background:var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
  }
  .coach-item:not(.head) .coach-icon{
    background:var(--navy);
    color:var(--white);
    font-size:14px;
    font-weight:800;
  }
  .coach-name{
    font-size:15.5px;
    font-weight:700;
    color:var(--navy);
  }
</style>
</head>

      <div class="search-wrap">
        <input id="numInput" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="#" maxlength="2" autocomplete="off">
        <button id="clearBtn">✕</button>
      </div>

      <div class="result" id="result">
        <div class="placeholder">
          <span class="big">🏈</span>
          Enter a jersey number to find a player
        </div>
      </div>

      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="back" data-k="back">⌫</button><button class="zero" data-k="0">0</button><button class="back" data-k="clear">C</button>
      </div>
    </section>

    <!-- ROSTER VIEW -->
    <section class="view" id="roster">
      <input class="search-list" id="rosterSearch" type="text" placeholder="Filter by name or number...">
      <div class="count" id="rosterCount"></div>
      <div id="rosterList"></div>
    </section>

    <!-- COACHES VIEW -->
    <section class="view" id="coaches">
      <div class="coach-section-label">Head Coach</div>
      <div class="coach-item head">
        <div class="coach-icon">🏈</div>
        <div class="coach-name">Samuel Ridley</div>
      </div>

      <div class="coach-section-label">Assistant Coaches</div>
      <div id="assistantCoachList"></div>
    </section>
  </main>
</div>

<script>
const roster = [
  {num:0,name:'Griffin Waters',pos:'QB',grade:'6th'},
  {num:1,name:'Luke Todd',pos:'RB/DB',grade:'6th'},
  {num:2,name:'Marcos Arango',pos:'QB/WR/DB',grade:'7th'},
  {num:3,name:'Owen Farrar',pos:'WR/DB',grade:'8th'},
  {num:4,name:'Luke Weinlein',pos:'WR/DB',grade:'8th'},
  {num:5,name:'Liam Westbrook',pos:'RB/LB',grade:'7th'},
  {num:6,name:'Drew Fegan',pos:'WR/DB',grade:'8th'},
  {num:7,name:'Ashten Baugh',pos:'QB/DB',grade:'8th'},
  {num:8,name:'Joe Tweedall',pos:'WR/RB/DB',grade:'7th'},
  {num:9,name:'Cole Stephens',pos:'WR/DB',grade:'7th'},
  {num:10,name:'Reece Green',pos:'WR/DB',grade:'8th'},
  {num:11,name:'Torrian "Duke" Horton',pos:'RB/DB',grade:'7th'},
  {num:12,name:'Dylan Agee',pos:'RB/DB',grade:'8th'},
  {num:13,name:'Bostic Marass',pos:'WR/DB',grade:'7th'},
  {num:14,name:'Jerry "JT" Taylor III',pos:'DB',grade:'8th'},
  {num:15,name:'Walker Barclay',pos:'QB/WR',grade:'6th'},
  {num:20,name:'Kenyon Esmond',pos:'DB',grade:'8th'},
  {num:21,name:'Ashton Rhodes',pos:'RB/DB',grade:'8th'},
  {num:22,name:'Josiah Calhoun',pos:'RB/LB',grade:'7th'},
  {num:23,name:'Zac McCain',pos:'WR/DB',grade:'6th'},
  {num:24,name:'Dimitrius Keffas',pos:'DB',grade:'8th'},
  {num:25,name:'Caleb Stephenson',pos:'WR/DB',grade:'6th'},
  {num:33,name:'Nyzire Montroy',pos:'RB/LB',grade:'8th'},
  {num:34,name:'Tucker Odom',pos:'LB/RB',grade:'8th'},
  {num:35,name:'Huck Phillips',pos:'LB/TE',grade:'8th'},
  {num:40,name:'Jameson Mullady',pos:'LB',grade:'8th'},
  {num:50,name:'Sawyer Brinson',pos:'OL/DL',grade:'8th'},
  {num:51,name:'Christian Easley',pos:'OL/DL',grade:'6th'},
  {num:54,name:'Maverick Brown',pos:'OL/DL',grade:'7th'},
  {num:55,name:'Archie Bandas',pos:'OL/DL',grade:'7th'},
  {num:56,name:'Van Holmes',pos:'OL/DL',grade:'7th'},
  {num:57,name:'Cotton Daniel',pos:'OL/DL',grade:'8th'},
  {num:60,name:'Bruno Alvarez',pos:'OL',grade:'8th'},
  {num:64,name:'Miguel de los Santos',pos:'DL',grade:'8th'},
  {num:70,name:'Jeremiah Miller Thomas',pos:'OL/DL',grade:'8th'},
  {num:71,name:'Emerson Azama Figueroa',pos:'OL/DL',grade:'8th'},
  {num:72,name:'Jonas Nieto Mejia',pos:'OL/DL',grade:'8th'},
  {num:77,name:'Caydon Swauger',pos:'OL/DL',grade:'8th'},
  {num:81,name:'Michael Glaser',pos:'TE/LB',grade:'7th'},
  {num:82,name:'Whit Graves',pos:'WR/DB',grade:'8th'},
  {num:84,name:'John Elliott',pos:'WR/DB',grade:'8th'},
  {num:85,name:'Robert Swafford',pos:'WR/DB',grade:'8th'},
  {num:88,name:'Eli McCauley',pos:'DL',grade:'8th'}
];

const byNum = {};
roster.forEach(p => byNum[p.num] = p);

// ---- Tabs ----
const tabs = document.querySelectorAll('.tab');
const views = document.querySelectorAll('.view');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    views.forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab === 'roster') renderRosterList('');
  });
});

// ---- Lookup view ----
const numInput = document.getElementById('numInput');
const resultEl = document.getElementById('result');
const clearBtn = document.getElementById('clearBtn');

function renderResult(){
  const val = numInput.value.trim();
  clearBtn.style.display = val ? 'block' : 'none';

  if(!val){
    resultEl.innerHTML = `<div class="placeholder"><span class="big">🏈</span>Enter a jersey number to find a player</div>`;
    return;
  }
  const n = parseInt(val,10);
  const player = byNum[n];
  if(player){
    const gradeLine = player.grade ? `${player.pos} · ${player.grade} Grade` : `${player.pos} · Grade TBD`;
    resultEl.innerHTML = `
      <div class="result-card">
        <div class="jersey">#${n}</div>
        <div class="name">${player.name}</div>
        <div class="meta">${gradeLine}</div>
      </div>`;
  } else {
    resultEl.innerHTML = `
      <div class="result-card">
        <div class="not-found">No player wears #${n}</div>
      </div>`;
  }
}

numInput.addEventListener('input', () => {
  numInput.value = numInput.value.replace(/[^0-9]/g,'').slice(0,2);
  renderResult();
});
clearBtn.addEventListener('click', () => {
  numInput.value = '';
  renderResult();
  numInput.focus();
});

// on-screen keypad (helps when parents tap instead of the native keyboard)
document.getElementById('keypad').addEventListener('click', (e) => {
  const k = e.target.dataset.k;
  if(!k) return;
  if(k === 'back'){
    numInput.value = numInput.value.slice(0,-1);
  } else if(k === 'clear'){
    numInput.value = '';
  } else {
    if(numInput.value.length < 2) numInput.value += k;
  }
  renderResult();
});

// ---- Roster list view ----
const rosterList = document.getElementById('rosterList');
const rosterCount = document.getElementById('rosterCount');
const rosterSearch = document.getElementById('rosterSearch');

function renderRosterList(filter){
  const f = filter.trim().toLowerCase();
  const filtered = roster.filter(p =>
    p.name.toLowerCase().includes(f) ||
    String(p.num).includes(f) ||
    p.pos.toLowerCase().includes(f) ||
    (p.grade && p.grade.toLowerCase().includes(f))
  );
  rosterCount.textContent = `${filtered.length} of ${roster.length} players`;
  if(filtered.length === 0){
    rosterList.innerHTML = `<div class="no-results">No matching players</div>`;
    return;
  }
  rosterList.innerHTML = filtered.map(p => `
    <div class="roster-item">
      <div class="num">${p.num}</div>
      <div class="nm-wrap">
        <div class="nm">${p.name}</div>
        <div class="sub">${p.pos}${p.grade ? ' · ' + p.grade : ' · Grade TBD'}</div>
      </div>
    </div>
  `).join('');
}
rosterSearch.addEventListener('input', () => renderRosterList(rosterSearch.value));

renderRosterList('');

// ---- Coaches view ----
const assistantCoaches = [
  'Zack Looney',
  'Kenny Fuller',
  'Travis Smotherman',
  'Trevon Hunter',
  'Walter Simmons',
  'Jahmyr Sykes',
  'Mark Stephenson'
];

function initials(name){
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

document.getElementById('assistantCoachList').innerHTML = assistantCoaches.map(name => `
  <div class="coach-item">
    <div class="coach-icon">${initials(name)}</div>
    <div class="coach-name">${name}</div>
  </div>
`).join('');
</script>
</body>
</html>
